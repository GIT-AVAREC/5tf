<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HTML Редактор — Мобильная студия кода</title>
  <style>
    /* =====================================================================
       1. СБРОС СТИЛЕЙ И БАЗОВАЯ ПАЛИТРА (ТОЧНО КАК НА СКРИНШОТЕ)
       ===================================================================== */
    :root {
      --bg-bar: #1e293b;
      --bg-editor: #0b1120;
      --bg-tile: #283549;
      --bg-btn-top: #475569;
      --border-bar: #334155;
      --border-tile: #3b4b63;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --status-ok: #34d399;
      --status-warn: #fbbf24;
      --status-err: #f87171;
      --syn-blue: #38bdf8;
      --syn-gold: #fbbf24;
      --syn-green: #4ade80;
      --syn-purple: #c084fc;
      --syn-comment: #64748b;
      --btn-red: #ef4444;
      --btn-red-active: #dc2626;
      --btn-sky: #0ea5e9;
      --btn-sky-active: #0284c7;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-editor);
      color: var(--text-main);
      font-family: var(--font-ui);
    }

    /* Основной вертикальный каркас приложения */
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: 960px;
      margin: 0 auto;
      background: var(--bg-editor);
    }

    /* =====================================================================
       2. ВЕРХНЯЯ СТАТУС-ПАНЕЛЬ И СОХРАНЕНИЕ / ОТКРЫТИЕ .HTML
       ===================================================================== */
    .status-bar {
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-bar);
      padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      min-height: 36px;
    }

    .status-text {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--status-ok);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      letter-spacing: 0.01em;
    }

    .status-text.warn {
      color: var(--status-warn);
    }

    .status-text.err {
      color: var(--status-err);
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-file-btn {
      border: 1px solid var(--border-tile);
      background: var(--bg-tile);
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .mini-file-btn:active {
      transform: scale(0.96);
      background: var(--bg-btn-top);
    }

    .mini-file-btn.save-accent {
      border-color: rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
    }

    /* =====================================================================
       3. ПЕРВЫЙ РЯД КНОПОК ДЕЙСТВИЙ (КОПИРОВАТЬ / ВСТАВИТЬ / ПОДЕЛИТЬСЯ)
       ===================================================================== */
    .top-actions-row {
      background: var(--bg-bar);
      padding: 7px 10px 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: var(--bg-btn-top);
      color: #f8fafc;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.08s ease, background 0.14s ease;
    }

    .action-btn:active {
      transform: scale(0.97);
      background: #64748b;
    }

    .action-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* =====================================================================
       4. ВТОРОЙ РЯД БЫСТРЫХ КЛАВИШ СИМВОЛОВ И АТРИБУТОВ
       ===================================================================== */
    .quick-keys-bar {
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-bar);
      padding: 3px 10px 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .quick-keys-bar::-webkit-scrollbar {
      display: none;
    }

    .q-key {
      border: 1px solid var(--border-tile);
      background: var(--bg-tile);
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      min-width: 44px;
      height: 40px;
      padding: 0 11px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
      transition: transform 0.07s ease, background 0.12s ease;
    }

    .q-key:active {
      transform: scale(0.93);
      background: #33445c;
    }

    .q-key.sym-blue {
      color: var(--syn-blue);
    }

    .q-key.attr-gold {
      color: var(--syn-gold);
      font-size: 14.5px;
      padding: 0 13px;
    }

    .q-key.tag-green {
      color: var(--syn-green);
      font-size: 14px;
      padding: 0 12px;
    }

    /* =====================================================================
       5. РАБОЧАЯ ОБЛАСТЬ РЕДАКТОРА С ПОДСВЕТКОЙ СИНТАКСИСА
       ===================================================================== */
    .editor-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--bg-editor);
      overflow: hidden;
    }

    /* Общие параметры шрифта и геометрии для идеального совпадения слоя подсветки и textarea */
    .code-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 16px 14px 28px;
      border: 0;
      font-family: var(--font-mono);
      font-size: 16.5px;
      line-height: 1.52;
      letter-spacing: 0px;
      tab-size: 2;
      -moz-tab-size: 2;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #highlightLayer {
      z-index: 1;
      pointer-events: none;
      color: var(--text-main);
      background: transparent;
    }

    #highlightLayer code {
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
    }

    #codeInput {
      z-index: 2;
      resize: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: #38bdf8;
      -webkit-text-fill-color: transparent;
    }

    /* Когда поле пустое, показываем чёткий плейсхолдер как на скриншоте */
    #codeInput::placeholder {
      color: var(--text-muted);
      -webkit-text-fill-color: var(--text-muted);
      opacity: 0.9;
    }

    #codeInput::selection {
      background: rgba(56, 189, 248, 0.28);
    }

    /* Токены подсветки синтаксиса HTML / CSS / JS */
    .tok-punct { color: #64748b; }
    .tok-tag { color: #38bdf8; }
    .tok-attr { color: #fbbf24; }
    .tok-str { color: #4ade80; }
    .tok-comm { color: #64748b; font-style: italic; }
    .tok-doc { color: #c084fc; }

    /* =====================================================================
       6. НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ (ОЧИСТИТЬ / ЗАПУСТИТЬ)
       ===================================================================== */
    .bottom-bar {
      background: var(--bg-bar);
      border-top: 1px solid var(--border-bar);
      padding: 9px 10px calc(10px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .bottom-btn {
      border: 0;
      height: 46px;
      border-radius: 11px;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.08s ease, background 0.14s ease;
    }

    .bottom-btn:active {
      transform: scale(0.98);
    }

    .btn-clear {
      background: var(--btn-red);
    }

    .btn-clear:active {
      background: var(--btn-red-active);
    }

    .btn-clear.undo-mode {
      background: #f59e0b;
      color: #0f172a;
    }

    .btn-run {
      background: var(--btn-sky);
      letter-spacing: 0.03em;
    }

    .btn-run:active {
      background: var(--btn-sky-active);
    }

    /* =====================================================================
       7. ОКНО ЖИВОГО ПРЕДПРОСМОТРА (ЗАПУСТИТЬ)
       ===================================================================== */
    .preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #0b1120;
      display: none;
      flex-direction: column;
    }

    .preview-overlay.open {
      display: flex;
    }

    .preview-header {
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-bar);
      padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .preview-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #ffffff;
    }

    /* =====================================================================
       8. МОДАЛЬНЫЕ ОКНА (СОХРАНЕНИЕ .HTML / ПОДЕЛИТЬСЯ) И УВЕДОМЛЕНИЯ
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 6, 23, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: var(--bg-bar);
      border: 1px solid var(--border-tile);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-close {
      border: 0;
      background: var(--bg-tile);
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .modal-input-row {
      display: flex;
      align-items: center;
      background: var(--bg-editor);
      border: 1px solid var(--border-tile);
      border-radius: 10px;
      padding: 0 10px;
      height: 42px;
    }

    .modal-input-row input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 15px;
    }

    .modal-input-row span {
      color: var(--syn-blue);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
    }

    .modal-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .share-link {
      text-decoration: none;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      height: 38px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(68px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 10px);
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--border-tile);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 80;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 1. ВЕРХНЯЯ СТАТУС-ПАНЕЛЬ С ВАЛИДАТОРОМ И КНОПКАМИ .HTML -->
    <header class="status-bar">
      <div id="statusIndicator" class="status-text">✓ Код в порядке</div>
      <div class="file-actions">
        <label class="mini-file-btn" title="Открыть .html файл с устройства" style="margin:0;">
          <span>📂 Открыть</span>
          <input id="openFileInput" type="file" accept=".html,.htm,.txt,text/html" hidden />
        </label>
        <button type="button" id="topSaveHtmlBtn" class="mini-file-btn save-accent" title="Сохранить файл в формате .html">
          💾 Сохранить .html
        </button>
      </div>
    </header>

    <!-- 2. ПЕРВЫЙ РЯД КНОПОК ДЕЙСТВИЙ (КАК НА СКРИНШОТЕ) -->
    <section class="top-actions-row" aria-label="Действия с кодом">
      <button type="button" id="copyBtn" class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>Копировать</span>
      </button>

      <button type="button" id="pasteBtn" class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          <path d="M12 11v6"></path>
          <path d="M9 14l3 3 3-3"></path>
        </svg>
        <span>Вставить</span>
      </button>

      <button type="button" id="shareBtn" class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        <span>Поделиться</span>
      </button>
    </section>

    <!-- 3. ВТОРОЙ РЯД БЫСТРЫХ КЛАВИШ СИМВОЛОВ И АТРИБУТОВ -->
    <nav class="quick-keys-bar" aria-label="Быстрые символы">
      <button type="button" class="q-key sym-blue" data-insert="<">&lt;</button>
      <button type="button" class="q-key sym-blue" data-insert="/">/</button>
      <button type="button" class="q-key sym-blue" data-insert="=">=</button>
      <button type="button" class="q-key sym-blue" data-insert="{">{</button>
      <button type="button" class="q-key sym-blue" data-insert="}">}</button>
      <button type="button" class="q-key attr-gold" data-insert='class=""' data-cursor="-1">class</button>
      <button type="button" class="q-key attr-gold" data-insert='style=""' data-cursor="-1">style</button>
      <!-- Дополнительные клавиши при свайпе вправо -->
      <button type="button" class="q-key sym-blue" data-insert=">">&gt;</button>
      <button type="button" class="q-key sym-blue" data-insert='"'>"</button>
      <button type="button" class="q-key sym-blue" data-insert=";">;</button>
      <button type="button" class="q-key sym-blue" data-insert=":">:</button>
      <button type="button" class="q-key sym-blue" data-insert="(">(</button>
      <button type="button" class="q-key sym-blue" data-insert=")">)</button>
      <button type="button" class="q-key tag-green" data-insert="<div></div>" data-cursor="-6">div</button>
      <button type="button" class="q-key tag-green" data-template="html5">html</button>
    </nav>

    <!-- 4. ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ РЕДАКТОРА -->
    <main class="editor-stage">
      <pre id="highlightLayer" class="code-layer" aria-hidden="true"><code id="highlightCode"></code></pre>
      <textarea
        id="codeInput"
        class="code-layer"
        placeholder="Начни писать код..."
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      ></textarea>
    </main>

    <!-- 5. НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ (ОЧИСТИТЬ / ЗАПУСТИТЬ) -->
    <footer class="bottom-bar">
      <button type="button" id="clearBtn" class="bottom-btn btn-clear">Очистить</button>
      <button type="button" id="runBtn" class="bottom-btn btn-run">ЗАПУСТИТЬ</button>
    </footer>
  </div>

  <!-- ОКНО ЖИВОГО ПРЕДПРОСМОТРА (ПОСЛЕ НАЖАТИЯ «ЗАПУСТИТЬ») -->
  <section id="previewOverlay" class="preview-overlay" aria-label="Предпросмотр HTML">
    <div class="preview-header">
      <button type="button" id="backToCodeBtn" class="mini-file-btn">← Назад в код</button>
      <span class="preview-title">Живой предпросмотр</span>
      <div class="preview-btns">
        <button type="button" id="refreshPreviewBtn" class="mini-file-btn" title="Обновить">↻</button>
        <button type="button" id="previewSaveHtmlBtn" class="mini-file-btn save-accent">💾 Сохранить .html</button>
      </div>
    </div>
    <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-forms allow-modals"></iframe>
  </section>

  <!-- МОДАЛЬНОЕ ОКНО СОХРАНЕНИЯ ФАЙЛА В ФОРМАТЕ .HTML -->
  <div id="saveModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Сохранить HTML файл">
    <div class="modal-box">
      <div class="modal-head">
        <h3>💾 Сохранить в формате .html</h3>
        <button type="button" id="closeSaveModalBtn" class="modal-close">✕</button>
      </div>
      <div style="font-size: 13px; color: var(--text-muted);">
        Укажите имя файла для скачивания на устройство:
      </div>
      <div class="modal-input-row">
        <input id="fileNameInput" type="text" value="index" placeholder="index" autocapitalize="off" autocorrect="off" />
        <span>.html</span>
      </div>
      <div class="modal-grid-2">
        <button type="button" id="cancelSaveBtn" class="action-btn" style="background: var(--bg-tile);">Отмена</button>
        <button type="button" id="confirmSaveBtn" class="action-btn" style="background: var(--btn-sky);">Скачать .html</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО «ПОДЕЛИТЬСЯ» (ЗАПАСНОЕ МЕНЮ + БЫСТРОЕ СКАЧИВАНИЕ) -->
  <div id="shareModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Поделиться кодом">
    <div class="modal-box">
      <div class="modal-head">
        <h3>📤 Поделиться HTML-кодом</h3>
        <button type="button" id="closeShareModalBtn" class="modal-close">✕</button>
      </div>
      <div style="font-size: 13px; color: var(--text-muted);">
        Выберите способ отправки кода или скачайте готовый файл:
      </div>
      <div class="modal-grid-3">
        <a id="tgShareLink" href="#" target="_blank" rel="noopener" class="share-link" style="background:#229ed9;">Telegram</a>
        <a id="waShareLink" href="#" target="_blank" rel="noopener" class="share-link" style="background:#25d366;">WhatsApp</a>
        <a id="mailShareLink" href="#" class="share-link" style="background:#6366f1;">Email</a>
      </div>
      <div class="modal-grid-2">
        <button type="button" id="shareCopyBtn" class="action-btn">📋 Копировать</button>
        <button type="button" id="shareDownloadBtn" class="action-btn" style="background: var(--btn-sky);">💾 Файл .html</button>
      </div>
    </div>
  </div>

  <!-- Всплывающее уведомление -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'mobile_html_editor_draft_v1';
      const codeInput = document.getElementById('codeInput');
      const highlightLayer = document.getElementById('highlightLayer');
      const highlightCode = document.getElementById('highlightCode');
      const statusIndicator = document.getElementById('statusIndicator');
      const clearBtn = document.getElementById('clearBtn');
      const toastEl = document.getElementById('toast');

      let lastClearedBackup = null;
      let toastTimer = null;

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
      }

      /* =====================================================================
         1. ПОДСВЕТКА СИНТАКСИСА HTML В РЕАЛЬНОМ ВРЕМЕНИ
         ===================================================================== */
      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function highlightHtml(source) {
        if (!source) return '';
        let out = '';
        let i = 0;
        const len = source.length;

        while (i < len) {
          // Комментарии <!-- ... -->
          if (source.startsWith('<!--', i)) {
            const end = source.indexOf('-->', i + 4);
            const stop = end === -1 ? len : end + 3;
            out += '<span class="tok-comm">' + escapeHtml(source.slice(i, stop)) + '</span>';
            i = stop;
            continue;
          }

          // DOCTYPE
          if (/^<!doctype/i.test(source.slice(i, i + 10))) {
            const end = source.indexOf('>', i);
            const stop = end === -1 ? len : end + 1;
            out += '<span class="tok-doc">' + escapeHtml(source.slice(i, stop)) + '</span>';
            i = stop;
            continue;
          }

          // HTML-тег <...>
          if (source[i] === '<' && (i + 1 < len) && /[a-zA-Z\/!?]/.test(source[i + 1])) {
            const closeIdx = source.indexOf('>', i);
            if (closeIdx !== -1) {
              const rawTag = source.slice(i, closeIdx + 1);
              out += formatTag(rawTag);
              i = closeIdx + 1;
              continue;
            }
          }

          out += escapeHtml(source[i]);
          i++;
        }

        // Гарантируем правильный перенос последней пустой строки
        if (source.endsWith('\n')) out += ' ';
        return out;
      }

      function formatTag(rawTag) {
        const m = rawTag.match(/^<(\/?)([a-zA-Z0-9-]+)([\s\S]*?)(\/?)>$/);
        if (!m) return '<span class="tok-punct">' + escapeHtml(rawTag) + '</span>';
        const [, slashOpen, tagName, attrsRaw, slashClose] = m;

        const highlightedAttrs = attrsRaw.replace(
          /([a-zA-Z_:][-a-zA-Z0-9_:.]*)(\s*=\s*)("[^"]*"|'[^']*'|[^\s"'=<>`]+)?/g,
          (_, attrName, eq, attrVal) => {
            let res = '<span class="tok-attr">' + escapeHtml(attrName) + '</span>' +
                      '<span class="tok-punct">' + escapeHtml(eq) + '</span>';
            if (attrVal !== undefined) {
              res += '<span class="tok-str">' + escapeHtml(attrVal) + '</span>';
            }
            return res;
          }
        );

        return (
          '<span class="tok-punct">&lt;' + escapeHtml(slashOpen) + '</span>' +
          '<span class="tok-tag">' + escapeHtml(tagName) + '</span>' +
          highlightedAttrs +
          '<span class="tok-punct">' + escapeHtml(slashClose) + '&gt;</span>'
        );
      }

      /* =====================================================================
         2. ЖИВОЙ ВАЛИДАТОР СИНТАКСИСА (ТЕГИ И СКОБКИ КАК НА СКРИНШОТЕ)
         ===================================================================== */
      const VOID_TAGS = new Set([
        'area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
        'link', 'meta', 'param', 'source', 'track', 'wbr'
      ]);

      function validateCode(code) {
        if (!code.trim()) {
          return { state: 'ok', message: '✓ Код в порядке' };
        }

        // 1. Проверка парных скобок {, (, [ вне строк и комментариев
        const cleaned = code
          .replace(/<!--[\s\S]*?-->/g, '')
          .replace(/\/\*[\s\S]*?\*\//g, '')
          .replace(/"(?:\\.|[^"\\])*"/g, '""')
          .replace(/'(?:\\.|[^'\\])*'/g, "''");

        const bracketStack = [];
        const pairs = { '{': '}', '(': ')', '[': ']' };
        const closers = { '}': '{', ')': '(', ']': '[' };

        for (let i = 0; i < cleaned.length; i++) {
          const ch = cleaned[i];
          if (pairs[ch]) {
            bracketStack.push(ch);
          } else if (closers[ch]) {
            const top = bracketStack.pop();
            if (top !== closers[ch]) {
              return { state: 'err', message: `⚠ Лишняя скобка ${ch}` };
            }
          }
        }

        if (bracketStack.length > 0) {
          const unclosed = bracketStack[bracketStack.length - 1];
          return { state: 'warn', message: `⚠ Не закрыта скобка ${unclosed}` };
        }

        // 2. Проверка парных HTML-тегов
        const withoutScripts = code
          .replace(/<!--[\s\S]*?-->/g, '')
          .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
          .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, '');

        const tagRegex = /<\/?([a-zA-Z][a-zA-Z0-9-]*)\b[^>]*\/?>/g;
        const tagStack = [];
        let match;

        while ((match = tagRegex.exec(withoutScripts)) !== null) {
          const full = match[0];
          const tag = match[1].toLowerCase();
          if (VOID_TAGS.has(tag) || full.endsWith('/>')) continue;

          if (full.startsWith('</')) {
            if (!tagStack.length) {
              return { state: 'err', message: `⚠ Лишний тег </${tag}>` };
            }
            const last = tagStack.pop();
            if (last !== tag) {
              return { state: 'warn', message: `⚠ Ожидался </${last}>, найден </${tag}>` };
            }
          } else {
            tagStack.push(tag);
          }
        }

        if (tagStack.length > 0) {
          const unclosedTag = tagStack[tagStack.length - 1];
          return { state: 'warn', message: `⚠ Не закрыт тег <${unclosedTag}>` };
        }

        return { state: 'ok', message: '✓ Код в порядке' };
      }

      function syncEditor() {
        const val = codeInput.value;
        highlightCode.innerHTML = highlightHtml(val);
        highlightLayer.scrollTop = codeInput.scrollTop;
        highlightLayer.scrollLeft = codeInput.scrollLeft;

        const res = validateCode(val);
        statusIndicator.textContent = res.message;
        statusIndicator.className = 'status-text' + (res.state === 'ok' ? '' : ' ' + res.state);

        try {
          localStorage.setItem(STORAGE_KEY, val);
        } catch (e) {}
      }

      codeInput.addEventListener('input', () => {
        if (lastClearedBackup !== null && codeInput.value.length > 0) {
          lastClearedBackup = null;
          clearBtn.textContent = 'Очистить';
          clearBtn.classList.remove('undo-mode');
        }
        syncEditor();
      });

      codeInput.addEventListener('scroll', () => {
        highlightLayer.scrollTop = codeInput.scrollTop;
        highlightLayer.scrollLeft = codeInput.scrollLeft;
      });

      // Поддержка автоотступов при нажатии Enter и клавиши Tab
      codeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          insertAtCursor('  ', 0);
        } else if (e.key === 'Enter') {
          const pos = codeInput.selectionStart;
          const before = codeInput.value.slice(0, pos);
          const lineStart = before.lastIndexOf('\n') + 1;
          const currentLine = before.slice(lineStart);
          const indentMatch = currentLine.match(/^[ \t]*/);
          let indent = indentMatch ? indentMatch[0] : '';
          if (/<[a-zA-Z][^>/]*>\s*$/.test(currentLine) || /\{\s*$/.test(currentLine)) {
            indent += '  ';
          }
          e.preventDefault();
          insertAtCursor('\n' + indent, 0);
        }
      });

      /* =====================================================================
         3. БЫСТРАЯ ПАНЕЛЬ СИМВОЛОВ (<, /, =, {, }, class, style и др.)
         ===================================================================== */
      const HTML5_TEMPLATE =
`<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя страница</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Привет, мир!</h1>
</body>
</html>`;

      function insertAtCursor(text, cursorOffset) {
        codeInput.focus();
        const start = codeInput.selectionStart ?? codeInput.value.length;
        const end = codeInput.selectionEnd ?? codeInput.value.length;
        const val = codeInput.value;

        codeInput.value = val.slice(0, start) + text + val.slice(end);
        const nextPos = start + text.length + (cursorOffset || 0);
        codeInput.selectionStart = nextPos;
        codeInput.selectionEnd = nextPos;
        syncEditor();
      }

      document.querySelectorAll('.q-key').forEach((btn) => {
        // Предотвращаем потерю фокуса клавиатуры на iOS/Android
        btn.addEventListener('pointerdown', (e) => e.preventDefault());
        btn.addEventListener('click', () => {
          if (btn.dataset.template === 'html5') {
            if (!codeInput.value.trim()) {
              codeInput.value = HTML5_TEMPLATE;
              syncEditor();
              showToast('Шаблон HTML5 вставлен');
            } else {
              insertAtCursor(HTML5_TEMPLATE, 0);
            }
            return;
          }
          const snippet = btn.dataset.insert || '';
          const offset = Number(btn.dataset.cursor || 0);
          insertAtCursor(snippet, offset);
        });
      });

      /* =====================================================================
         4. КНОПКИ «КОПИРОВАТЬ», «ВСТАВИТЬ», «ПОДЕЛИТЬСЯ»
         ===================================================================== */
      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch (e) {}
        document.body.removeChild(ta);
        return ok;
      }

      document.getElementById('copyBtn').addEventListener('click', async () => {
        const text = codeInput.value;
        if (!text) {
          showToast('Редактор пока пуст');
          return;
        }
        let copied = false;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            copied = true;
          } catch (e) {}
        }
        if (!copied) copied = fallbackCopy(text);
        showToast(copied ? 'Скопировано!' : 'Не удалось скопировать');
      });

      document.getElementById('pasteBtn').addEventListener('click', async () => {
        if (navigator.clipboard && navigator.clipboard.readText) {
          try {
            const clip = await navigator.clipboard.readText();
            if (clip) {
              insertAtCursor(clip, 0);
              showToast('Вставлено из буфера');
            } else {
              showToast('Буфер обмена пуст');
            }
            return;
          } catch (e) {}
        }
        codeInput.focus();
        showToast('Нажмите «Вставить» в меню клавиатуры');
      });

      const shareModal = document.getElementById('shareModal');

      document.getElementById('shareBtn').addEventListener('click', async () => {
        const text = codeInput.value;
        if (!text.trim()) {
          showToast('Сначала напишите код');
          return;
        }

        // Пробуем системный Web Share API с передачей файла index.html или текста
        if (navigator.share) {
          try {
            const file = new File([text], 'index.html', { type: 'text/html' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: 'index.html',
                text: 'HTML-код',
                files: [file]
              });
              return;
            }
            await navigator.share({
              title: 'HTML-код',
              text: text
            });
            return;
          } catch (e) {
            if (e && e.name === 'AbortError') return;
          }
        }

        // Резервное окно отправки, если Web Share API недоступен
        const enc = encodeURIComponent(text);
        document.getElementById('tgShareLink').href = 'https://t.me/share/url?url=&text=' + enc;
        document.getElementById('waShareLink').href = 'https://api.whatsapp.com/send?text=' + enc;
        document.getElementById('mailShareLink').href = 'mailto:?subject=index.html&body=' + enc;
        shareModal.classList.add('open');
      });

      document.getElementById('closeShareModalBtn').addEventListener('click', () => {
        shareModal.classList.remove('open');
      });

      document.getElementById('shareCopyBtn').addEventListener('click', () => {
        if (fallbackCopy(codeInput.value)) {
          showToast('Скопировано!');
          shareModal.classList.remove('open');
        }
      });

      document.getElementById('shareDownloadBtn').addEventListener('click', () => {
        shareModal.classList.remove('open');
        openSaveModal();
      });

      /* =====================================================================
         5. СОХРАНЕНИЕ И ОТКРЫТИЕ ФАЙЛА В ФОРМАТЕ .HTML
         ===================================================================== */
      const saveModal = document.getElementById('saveModal');
      const fileNameInput = document.getElementById('fileNameInput');

      function downloadHtmlFile(rawName) {
        const cleanName = (rawName || 'index')
          .trim()
          .replace(/\.html?$/i, '')
          .replace(/[\\/:*?"<>|]+/g, '_') || 'index';
        const fullName = cleanName + '.html';

        const blob = new Blob([codeInput.value], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fullName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        showToast(`Файл ${fullName} сохранён!`);
      }

      function openSaveModal() {
        saveModal.classList.add('open');
        setTimeout(() => {
          fileNameInput.focus();
          fileNameInput.select();
        }, 40);
      }

      document.getElementById('topSaveHtmlBtn').addEventListener('click', openSaveModal);
      document.getElementById('previewSaveHtmlBtn').addEventListener('click', openSaveModal);
      document.getElementById('closeSaveModalBtn').addEventListener('click', () => saveModal.classList.remove('open'));
      document.getElementById('cancelSaveBtn').addEventListener('click', () => saveModal.classList.remove('open'));

      document.getElementById('confirmSaveBtn').addEventListener('click', () => {
        saveModal.classList.remove('open');
        downloadHtmlFile(fileNameInput.value);
      });

      fileNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveModal.classList.remove('open');
          downloadHtmlFile(fileNameInput.value);
        }
      });

      // Открытие .html файла с устройства
      document.getElementById('openFileInput').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          codeInput.value = String(reader.result || '');
          const baseName = file.name.replace(/\.html?$/i, '');
          if (baseName) fileNameInput.value = baseName;
          syncEditor();
          showToast(`Открыт: ${file.name}`);
        };
        reader.readAsText(file, 'utf-8');
        e.target.value = '';
      });

      /* =====================================================================
         6. НИЖНИЕ КНОПКИ: «ОЧИСТИТЬ» (С ВОЗВРАТОМ) И «ЗАПУСТИТЬ» (ПРЕДПРОСМОТР)
         ===================================================================== */
      clearBtn.addEventListener('click', () => {
        if (lastClearedBackup !== null && !codeInput.value) {
          codeInput.value = lastClearedBackup;
          lastClearedBackup = null;
          clearBtn.textContent = 'Очистить';
          clearBtn.classList.remove('undo-mode');
          syncEditor();
          showToast('Код восстановлен');
          return;
        }

        if (!codeInput.value) {
          showToast('Редактор уже пуст');
          return;
        }

        lastClearedBackup = codeInput.value;
        codeInput.value = '';
        clearBtn.textContent = '↩ Вернуть';
        clearBtn.classList.add('undo-mode');
        syncEditor();
        showToast('Очищено (нажмите «Вернуть» для отмены)');
      });

      const previewOverlay = document.getElementById('previewOverlay');
      const previewFrame = document.getElementById('previewFrame');

      function launchPreview() {
        const html = codeInput.value.trim()
          ? codeInput.value
          : '<!doctype html><meta charset="utf-8"><body style="font-family:sans-serif;padding:24px;color:#334155;"><h3>Пустой документ</h3><p>Напишите HTML-код в редакторе и нажмите <b>ЗАПУСТИТЬ</b>.</p></body>';
        previewFrame.srcdoc = html;
        previewOverlay.classList.add('open');
      }

      document.getElementById('runBtn').addEventListener('click', launchPreview);
      document.getElementById('refreshPreviewBtn').addEventListener('click', launchPreview);
      document.getElementById('backToCodeBtn').addEventListener('click', () => {
        previewOverlay.classList.remove('open');
        previewFrame.srcdoc = '';
      });

      // Восстановление черновика при загрузке
      try {
        const savedDraft = localStorage.getItem(STORAGE_KEY);
        if (savedDraft) codeInput.value = savedDraft;
      } catch (e) {}

      syncEditor();
    })();
  </script>
</body>
</html>
